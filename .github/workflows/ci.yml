name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .
      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test (offline, extractive answers)
        run: |
          rag ingest examples/corpus --reset --tag beacon
          rag ingest examples/corpus | tee ingest.log
          grep -q "0 added, 0 updated, 9 unchanged, 0 removed" ingest.log
          rag ask "What is the REST API rate limit?"
          rag ask "What is the REST API rate limit?" --rerank proximity --source 'api-*' --tag beacon | tee ask.log
          grep -q "300 requests per minute" ask.log
          rag remove pricing.md
          rag stats | tee stats.log
          grep -q "from 8 documents" stats.log
          rag eval

  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install with optional extras
        run: pip install -e ".[all]"
      - name: Tests with pypdf and anthropic installed
        run: python -m unittest discover -s tests
