name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .
      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test (offline, extractive answers)
        run: |
          rag ingest examples/corpus --reset --tag beacon
          rag ingest examples/corpus | tee ingest.log
          grep -q "0 added, 0 updated, 9 unchanged, 0 removed" ingest.log
          rag ask "What is the REST API rate limit?"
          rag ask "What is the REST API rate limit?" --rerank proximity --source 'api-*' --tag beacon | tee ask.log
          grep -q "300 requests per minute" ask.log
          rag remove pricing.md
          rag stats | tee stats.log
          grep -q "from 8 documents" stats.log
          rag vacuum | tee vacuum.log
          grep -q "KiB reclaimed" vacuum.log
          rag ingest examples/corpus
          rag ask "How many seats does the Team plan allow?" --source 'pricing.*' | tee table.log
          grep -q "Seats: Up to 50" table.log
          rag eval --judge --modes hybrid,hybrid+proximity | tee eval.log
          grep -q "judged by heuristic" eval.log
          rag eval --questions examples/eval_compound.json --modes hybrid
          printf 'How do I rotate an SDK key?\nDoes the old one keep working?\n' | rag chat | tee chat.log
          grep -q "24-hour grace period" chat.log
          rag eval --questions examples/eval_followups.json --modes hybrid

  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install with optional extras
        run: pip install -e ".[all]"
      - name: Tests with pypdf and anthropic installed
        run: python -m unittest discover -s tests

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t rag-engine:ci .
      - name: Ingest, ask and serve from the image
        run: |
          docker volume create rag-data
          docker run --rm -v rag-data:/data rag-engine:ci ingest /app/examples/corpus
          docker run --rm -v rag-data:/data rag-engine:ci ask "What is the REST API rate limit?" | tee ask.log
          grep -q "300 requests per minute" ask.log
          docker run -d --name rag -p 8000:8000 -v rag-data:/data rag-engine:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          curl -sf localhost:8000/api/ask -d '{"question": "How often are backups taken?", "k": 2}' | tee api.log
          grep -q "every 6 hours" api.log
          docker rm -f rag
