name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .
      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test (offline, extractive answers)
        run: |
          rag ingest examples/corpus --reset
          rag ask "What is the REST API rate limit?"
          rag eval

  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with optional extras
        run: pip install -e ".[all]"
      - name: Tests with pypdf and anthropic installed
        run: python -m unittest discover -s tests
